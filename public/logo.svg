<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#18325A"/>
      <stop offset="70%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#050E1D"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="30%" stop-color="#F3C63F"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>

    <radialGradient id="coinShine" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="40%" stop-color="#F5CE56"/>
      <stop offset="85%" stop-color="#C29B27"/>
      <stop offset="100%" stop-color="#785C0D"/>
    </radialGradient>

    <!-- Suit Navy Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#224478"/>
      <stop offset="100%" stop-color="#0E2242"/>
    </linearGradient>

    <!-- Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D5538"/>
      <stop offset="100%" stop-color="#5C331E"/>
    </linearGradient>

    <!-- Hair Dark Gradient -->
    <radialGradient id="hairGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3A2318"/>
      <stop offset="70%" stop-color="#1A0D07"/>
      <stop offset="100%" stop-color="#090402"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Frame -->
  <circle cx="250" cy="250" r="245" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>

  <!-- Floating Background Gold Coins -->
  <!-- Top Left Coin -->
  <g transform="translate(100, 70) rotate(-15)">
    <ellipse cx="0" cy="0" rx="32" ry="22" fill="url(#coinShine)" stroke="#FFF" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="25" ry="16" fill="none" stroke="#9A7B1C" stroke-width="1"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#5C4508" text-anchor="middle">$</text>
  </g>

  <!-- Top Right Coin -->
  <g transform="translate(370, 90) rotate(20)">
    <ellipse cx="0" cy="0" rx="36" ry="25" fill="url(#coinShine)" stroke="#FFF" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="28" ry="18" fill="none" stroke="#9A7B1C" stroke-width="1"/>
    <text x="0" y="7" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#5C4508" text-anchor="middle">$</text>
  </g>

  <!-- Top Center Big Coin -->
  <g transform="translate(240, 35) rotate(5)">
    <ellipse cx="0" cy="0" rx="35" ry="18" fill="url(#coinShine)" stroke="#FFF" stroke-width="1"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#5C4508" text-anchor="middle">$</text>
  </g>

  <!-- Left Mid Coin -->
  <g transform="translate(85, 230) rotate(-30)">
    <circle cx="0" cy="0" r="38" fill="url(#coinShine)" stroke="#FFF" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#9A7B1C" stroke-width="1.5"/>
    <text x="0" y="9" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#5C4508" text-anchor="middle">$</text>
  </g>

  <!-- Right Mid Coin -->
  <g transform="translate(415, 240) rotate(15)">
    <circle cx="0" cy="0" r="36" fill="url(#coinShine)" stroke="#FFF" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#9A7B1C" stroke-width="1.5"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#5C4508" text-anchor="middle">$</text>
  </g>

  <!-- Bottom Left Coin -->
  <g transform="translate(115, 380) rotate(25)">
    <circle cx="0" cy="0" r="28" fill="url(#coinShine)" stroke="#FFF" stroke-width="1.5"/>
    <text x="0" y="7" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#5C4508" text-anchor="middle">$</text>
  </g>

  <!-- Bottom Right Coin -->
  <g transform="translate(385, 385) rotate(-20)">
    <circle cx="0" cy="0" r="30" fill="url(#coinShine)" stroke="#FFF" stroke-width="1.5"/>
    <text x="0" y="7" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#5C4508" text-anchor="middle">$</text>
  </g>

  <!-- CHARACTER: Afro Hair Base -->
  <g filter="url(#shadow)">
    <!-- Afro puff hair silhouette -->
    <circle cx="250" cy="155" r="95" fill="url(#hairGrad)" />
    <circle cx="180" cy="150" r="65" fill="url(#hairGrad)" />
    <circle cx="320" cy="150" r="65" fill="url(#hairGrad)" />
    <circle cx="155" cy="190" r="50" fill="url(#hairGrad)" />
    <circle cx="345" cy="190" r="50" fill="url(#hairGrad)" />
    <circle cx="250" cy="100" r="65" fill="url(#hairGrad)" />
  </g>

  <!-- Neck -->
  <rect x="232" y="210" width="36" height="45" rx="8" fill="url(#skinGrad)" />

  <!-- White Shirt Collar -->
  <polygon points="215,245 250,270 285,245 250,230" fill="#FFFFFF" />

  <!-- Blue Blazer Suit -->
  <path d="M 140 380 Q 150 250 210 240 L 250 275 L 290 240 Q 350 250 360 380 Z" fill="url(#suitGrad)" filter="url(#shadow)"/>
  <path d="M 180 245 L 215 310 L 250 280 L 285 310 L 320 245" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Character Face -->
  <ellipse cx="250" cy="180" rx="42" ry="48" fill="url(#skinGrad)" filter="url(#shadow)"/>

  <!-- Eyes -->
  <ellipse cx="233" cy="175" rx="8" ry="6" fill="#FFF" />
  <ellipse cx="267" cy="175" rx="8" ry="6" fill="#FFF" />
  <circle cx="233" cy="175" r="4.5" fill="#2C160B" />
  <circle cx="267" cy="175" r="4.5" fill="#2C160B" />
  <circle cx="231" cy="173" r="1.5" fill="#FFF" />
  <circle cx="265" cy="173" r="1.5" fill="#FFF" />

  <!-- Eyelashes & Eyebrows -->
  <path d="M 222 168 Q 233 163 242 168" fill="none" stroke="#1A0D07" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 258 168 Q 267 163 278 168" fill="none" stroke="#1A0D07" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 250 178 Q 247 188 250 190 Q 253 188 250 178" fill="#5C331E" />

  <!-- Smile -->
  <path d="M 230 198 Q 250 216 270 198 Z" fill="#FFF" stroke="#421E10" stroke-width="1.5"/>
  <path d="M 233 198 Q 250 204 267 198" fill="#C05C63" />

  <!-- Gold Earrings -->
  <circle cx="206" cy="188" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="294" cy="188" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- THREE GOLD MEDALS AROUND NECK -->
  <!-- Medal Ribbons -->
  <path d="M 225 220 L 235 285" stroke="#1E40AF" stroke-width="6" stroke-linecap="round"/>
  <path d="M 225 220 L 235 285" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <path d="M 275 220 L 265 285" stroke="#1E40AF" stroke-width="6" stroke-linecap="round"/>
  <path d="M 275 220 L 265 285" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

  <path d="M 250 225 L 250 290" stroke="#1D4ED8" stroke-width="7" stroke-linecap="round"/>

  <!-- Medal 1: Left (Star) -->
  <g transform="translate(222, 288)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="15" fill="url(#coinShine)" stroke="#FFF" stroke-width="1"/>
    <polygon points="0,-8 3,-2 9,-1 4,4 6,10 0,6 -6,10 -4,4 -9,-1 -3,-2" fill="#785C0D"/>
  </g>

  <!-- Medal 2: Center (Graduation Cap) -->
  <g transform="translate(250, 298)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="url(#coinShine)" stroke="#FFF" stroke-width="1.5"/>
    <!-- Grad Cap Icon -->
    <path d="M 0,-7 L 10,-2 L 0,3 L -10,-2 Z" fill="#5C4508"/>
    <rect x="-5" y="1" width="10" height="5" fill="#5C4508" rx="1"/>
  </g>

  <!-- Medal 3: Right (Handshake / Award) -->
  <g transform="translate(278, 288)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="15" fill="url(#coinShine)" stroke="#FFF" stroke-width="1"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#785C0D" stroke-width="2"/>
  </g>

  <!-- TABLET HELD BY HANDS: "RSC TAE" -->
  <g transform="translate(150, 315)" filter="url(#shadow)">
    <!-- Tablet Outer Frame -->
    <rect x="0" y="0" width="200" height="120" rx="14" fill="#0E1726" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Screen -->
    <rect x="8" y="8" width="184" height="104" rx="8" fill="#1E3A8A"/>
    <!-- Screen Header Bar -->
    <rect x="8" y="8" width="184" height="18" rx="4" fill="#1D4ED8"/>
    <!-- Camera Dot -->
    <circle cx="100" cy="13" r="2" fill="#93C5FD"/>
    
    <!-- TEXT ON TABLET -->
    <text x="100" y="70" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">
      RSC TAE
    </text>
    
    <text x="100" y="94" font-family="sans-serif" font-weight="700" font-size="10" fill="#93C5FD" text-anchor="middle" letter-spacing="3">
      PCCTAE / EBTT
    </text>
  </g>

  <!-- Hands Holding Tablet -->
  <!-- Left Hand -->
  <g transform="translate(142, 360)">
    <ellipse cx="12" cy="20" rx="14" ry="22" fill="url(#skinGrad)" filter="url(#shadow)"/>
    <circle cx="10" cy="10" r="6" fill="url(#skinGrad)"/>
    <circle cx="10" cy="20" r="6" fill="url(#skinGrad)"/>
    <circle cx="10" cy="30" r="6" fill="url(#skinGrad)"/>
  </g>
  <!-- Right Hand -->
  <g transform="translate(344, 360)">
    <ellipse cx="12" cy="20" rx="14" ry="22" fill="url(#skinGrad)" filter="url(#shadow)"/>
    <circle cx="14" cy="10" r="6" fill="url(#skinGrad)"/>
    <circle cx="14" cy="20" r="6" fill="url(#skinGrad)"/>
    <circle cx="14" cy="30" r="6" fill="url(#skinGrad)"/>
  </g>

  <!-- Foreground Floating Shiny Coins -->
  <g transform="translate(160, 395) rotate(-10)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="36" ry="24" fill="url(#coinShine)" stroke="#FFF" stroke-width="2"/>
    <text x="0" y="7" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#5C4508" text-anchor="middle">$</text>
  </g>

  <g transform="translate(325, 415) rotate(15)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="40" ry="26" fill="url(#coinShine)" stroke="#FFF" stroke-width="2"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#5C4508" text-anchor="middle">$</text>
  </g>
</svg>
